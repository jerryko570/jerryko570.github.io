name: Auto Blog Post

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: auto-blog-post
  cancel-in-progress: false

env:
  PRETENDARD_URL: "https://github.com/orioncactus/pretendard/raw/main/packages/pretendard/dist/public/static/Pretendard-ExtraBold.otf"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install fonts (Noto CJK + Pretendard)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

          sudo mkdir -p /usr/share/fonts/truetype/pretendard
          curl -fsSL "$PRETENDARD_URL" -o /tmp/pretendard.otf
          FILE_SIZE=$(wc -c < /tmp/pretendard.otf)
          if [ "$FILE_SIZE" -gt 100000 ]; then
            sudo mv /tmp/pretendard.otf /usr/share/fonts/truetype/pretendard/Pretendard-ExtraBold.otf
            sudo fc-cache -f > /dev/null
            echo "✅ Pretendard 설치 완료 (${FILE_SIZE} bytes)"
          else
            echo "⚠️ Pretendard 다운로드 실패 (${FILE_SIZE} bytes). Noto fallback 사용."
          fi

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Prepare candidates
        id: prepare
        run: |
          python scripts/prepare.py
          if [ -f scripts/candidates.json ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('scripts/candidates.json'))['candidates']))")
          else
            COUNT=0
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "📊 후보 개수: $COUNT"

      - name: Generate post with Claude Code
        if: steps.prepare.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "prompts/claude_instructions.md 파일을 읽고 그 안의 지시사항을 그대로 따라서 실행해줘."
          claude_args: "--max-turns 40 --model claude-sonnet-4-6 --allowedTools Read,Write,Edit,Bash,WebFetch,Glob,Grep"

      - name: Commit and push changes
        if: steps.prepare.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add _posts/ assets/img/thumbnail/ scripts/state.json

          if git diff --cached --quiet; then
            echo "✅ 변경사항 없음"
            exit 0
          fi

          git commit -m "auto: 새 블로그 포스트 자동 생성"
          git push origin HEAD:main
          echo "🎉 푸시 완료"
