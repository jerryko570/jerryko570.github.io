name: Auto Blog Post

on:
  schedule:
    # 3일마다 한국시간 오전 9시 실행 (UTC 00:00)
    - cron: "0 0 */3 * *"
  workflow_dispatch: # 수동 실행 버튼

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Korean fonts (for thumbnails)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Prepare candidates (crawl & filter)
        id: prepare
        run: |
          python scripts/prepare.py
          if [ -f scripts/candidates.json ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('scripts/candidates.json'))['candidates']))")
            echo "candidate_count=$COUNT" >> $GITHUB_OUTPUT
            echo "📊 후보 개수: $COUNT"
          else
            echo "candidate_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Read Claude instructions
        if: steps.prepare.outputs.candidate_count != '0'
        id: instructions
        run: |
          {
            echo 'content<<PROMPT_EOF'
            cat prompts/claude_instructions.md
            echo PROMPT_EOF
          } >> $GITHUB_OUTPUT

      - name: Generate post with Claude Code
        if: steps.prepare.outputs.candidate_count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.instructions.outputs.content }}
          claude_args: "--max-turns 40 --model claude-sonnet-4-6 --allowedTools Read,Write,Edit,Bash,WebFetch,Glob,Grep"

      - name: Commit and push if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git remote URL을 토큰 포함 형태로 재설정
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add _posts/ assets/img/thumbnail/ scripts/state.json 2>/dev/null || true
          git rm --cached scripts/candidates.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "✅ 변경사항 없음 (이번 턴은 패스)"
          else
            git commit -m "auto: 새 블로그 포스트 자동 생성 [skip ci]"
            git push origin HEAD:main
            echo "🎉 새 포스트 푸시 완료"
          fi
