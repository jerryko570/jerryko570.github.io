# 카테고리별 소스 설정
# 3일마다 카테고리를 순환 (9일에 한 바퀴)
#
# 원칙:
# 1. 공식 블로그만 (dev.to, Medium 같은 2차 소스 제외)
# 2. 최근 60일 이내 발표만 다룸
# 3. 카테고리 이름에 하이픈 금지 (Chirpy 호환성)

categories:
  - id: design-tools
    display_name: "Design"
    korean_label: "디자인 도구"
    description: "Figma, Framer 등 디자인 툴의 공식 업데이트 · 베타 기능"
    color_start: "#a855f7"
    color_end: "#ec4899"
    sources:
      - name: "Figma Blog"
        type: rss
        url: "https://www.figma.com/blog/rss.xml"
      - name: "Framer Blog"
        type: rss
        url: "https://www.framer.com/blog/rss.xml"

  - id: frontend
    display_name: "Frontend"
    korean_label: "프론트엔드 프레임워크"
    description: "React, Next.js, Tailwind 공식 업데이트 · 릴리스 노트"
    color_start: "#3b82f6"
    color_end: "#06b6d4"
    sources:
      - name: "React Blog"
        type: rss
        url: "https://react.dev/rss.xml"
      - name: "Next.js Blog (Vercel)"
        type: rss
        url: "https://vercel.com/atom"
      - name: "Tailwind Blog"
        type: rss
        url: "https://tailwindcss.com/blog/feed.xml"

  - id: dev-tools
    display_name: "DevTools"
    korean_label: "개발자 도구"
    description: "Anthropic(Claude), Vercel, 에이전트 도구 공식 발표"
    color_start: "#f59e0b"
    color_end: "#ea580c"
    sources:
      - name: "Anthropic News"
        type: rss
        url: "https://www.anthropic.com/news/rss.xml"
      - name: "OpenAI Blog"
        type: rss
        url: "https://openai.com/blog/rss.xml"
